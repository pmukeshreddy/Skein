[package]
name         = "skein_parity"
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }

[features]
# Library default is empty; the `skein_cli` binary forwards `cuda` here and
# carries the production GPU default. See that crate's Cargo.toml.
default = []
# Selects the CUDA compute + runtime backends for the forward pass driven by
# `RealSkeinForward`. Build with `--no-default-features` for the in-process
# CPU path used in CI and local development.
cuda = ["skein_compile/cuda", "skein_runtime/cuda"]

[lib]
path = "src/lib.rs"

[dependencies]
skein_ir      = { workspace = true }
skein_cost    = { workspace = true }
skein_extract = { workspace = true }
skein_compile = { workspace = true }
skein_runtime = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
thiserror     = { workspace = true }
tracing       = { workspace = true }

[dev-dependencies]
skein_emit    = { workspace = true }
tempfile      = "3.10"
safetensors   = { workspace = true }
