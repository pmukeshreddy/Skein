[package]
name         = "skein_parity"
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }

[features]
default = []
# Phase B paths (real HF subprocess + real Skein forward) are gated behind
# this feature so Mac builds never accidentally instantiate them.
cuda = []

[lib]
path = "src/lib.rs"

[dependencies]
skein_ir      = { workspace = true }
skein_cost    = { workspace = true }
skein_extract = { workspace = true }
skein_compile = { workspace = true }
skein_runtime = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
toml          = { workspace = true }
thiserror     = { workspace = true }
blake3        = { workspace = true }
tracing       = { workspace = true }

[dev-dependencies]
skein_emit    = { workspace = true }
tempfile      = "3.10"
safetensors   = { workspace = true }
