[package]
name         = "skein_runtime"
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }

[features]
# Library default is empty; the `skein_cli` binary forwards `cuda` here and
# carries the production GPU default. See that crate's Cargo.toml.
default = []
# CUDA-gated paths: NCCL between graph runs, CUDA Graphs capture/dispatch,
# RDMA for prefill/decode KV transfer. Pulls in `cudarc` (with its `nccl`
# bindings); requires an NVIDIA toolchain, so it is off in the CPU/CI build.
cuda = ["dep:cudarc", "skein_compile/cuda"]

[lib]
path = "src/lib.rs"

[dependencies]
skein_ir   = { workspace = true }
skein_cost = { workspace = true }
skein_emit = { workspace = true }
skein_compile = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
thiserror  = { workspace = true }
axum       = { workspace = true }
tower      = { workspace = true }
tokio      = { workspace = true }
futures-util = { workspace = true }
tracing    = { workspace = true }
prometheus = { workspace = true }
tokenizers = { workspace = true }

# CUDA collective bindings for the multi-GPU NCCL backend
# (`src/cuda/nccl.rs`). Optional + cuda-gated; the same pinned cudarc the
# Luminal CUDA backend uses, so the stream/buffer types interoperate.
cudarc     = { workspace = true, optional = true }

[dev-dependencies]
safetensors = { workspace = true }
