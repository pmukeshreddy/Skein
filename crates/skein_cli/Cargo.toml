[package]
name         = "skein_cli"
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }

[features]
# The `skein` binary defaults to the production CUDA build. `cuda` forwards to
# every CUDA-bearing library crate, so `cargo build` (and `cargo build
# --workspace`) targets the GPU. Building with `--no-default-features` selects
# the CPU `NativeComputeRuntime` path end-to-end (used by CI and GPU-less
# development) — the library crates default to empty features, so the toggle
# disables CUDA everywhere.
default = ["cuda"]
cuda = ["skein_compile/cuda", "skein_runtime/cuda", "skein_parity/cuda"]

# Hybrid layout: integration tests need to call into the command runners
# directly. Both the library and the binary live in this crate.
[lib]
path = "src/lib.rs"

[[bin]]
name = "skein"
path = "src/main.rs"

[dependencies]
skein_ir        = { workspace = true }
skein_cost      = { workspace = true }
skein_extract   = { workspace = true }
skein_emit      = { workspace = true }
skein_compile   = { workspace = true }
skein_parity    = { workspace = true }
skein_runtime   = { workspace = true }
skein_calibrate = { workspace = true }

serde      = { workspace = true }
serde_json = { workspace = true }
thiserror  = { workspace = true }
anyhow     = { workspace = true }
clap       = { workspace = true }
tokio      = { workspace = true }
tracing    = { workspace = true }
tracing-subscriber = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
tracing-opentelemetry = { workspace = true }

[dev-dependencies]
safetensors = { workspace = true }
