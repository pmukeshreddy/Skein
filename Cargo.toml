[workspace]
# edition = "2024" implies resolver "3" as the default; pinned explicitly so
# the choice is not silently revised by a future toolchain bump.
resolver = "3"
members = [
    "crates/skein_ir",
    "crates/skein_cost",
    "crates/skein_extract",
    "crates/skein_emit",
    "crates/skein_compile",
    "crates/skein_parity",
    "crates/skein_runtime",
    "crates/skein_cli",
    "crates/skein_calibrate",
]
# Vendored, patched copy of Luminal (see `[patch]` at the bottom). It is its own
# Cargo workspace, so exclude it from this one.
exclude = ["vendor/luminal"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"

[workspace.dependencies]
# --- core ---
serde       = { version = "1.0", features = ["derive"] }
serde_json  = "1.0"
toml        = "0.8"
thiserror   = "1.0"
anyhow      = "1.0"
clap        = { version = "4.5", features = ["derive"] }
axum        = "0.7"
tower       = "0.5"
tokio       = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
prometheus  = "0.13"
futures-util = "0.3"
opentelemetry = "0.22"
opentelemetry_sdk = { version = "0.22", features = ["rt-tokio"] }
opentelemetry-otlp = "0.15"
tracing-opentelemetry = "0.23"
blake3      = "1.5"
safetensors = "0.4"
bincode     = "1.3"
# Real BPE/WordPiece tokenizer (HuggingFace `tokenizers`). default-features off
# drops progressbar/http/esaxx; `onig` is the regex backend (bundles its
# oniguruma C source, built via `cc` — needs a C compiler, present on the
# Linux/macOS build hosts). Used by the serving runtime to encode prompts and
# decode generated tokens.
tokenizers  = { version = "0.20", default-features = false, features = ["onig"] }

# --- testing ---
proptest    = "1.4"

# --- intra-workspace ---
skein_ir        = { path = "crates/skein_ir" }
skein_cost      = { path = "crates/skein_cost" }
skein_extract   = { path = "crates/skein_extract" }
skein_emit      = { path = "crates/skein_emit" }
skein_compile   = { path = "crates/skein_compile" }
skein_parity    = { path = "crates/skein_parity" }
skein_runtime   = { path = "crates/skein_runtime" }
skein_calibrate = { path = "crates/skein_calibrate" }

# --- Luminal ---
# Search-based API: `cx.tensor(shape_tuple)` where each shape entry is
# `Into<Expression>` (usize for static dims, char for dynamic). Pinned to a
# verified rev. The graph-construction path builds without a CUDA toolkit;
# the CUDA compute backend comes from `luminal_cuda_lite`, pulled in by
# `skein_compile` only under the `cuda` feature.
luminal = { git = "https://github.com/luminal-ai/luminal", rev = "e558ce68498df842107ccb32e316efff4801ccc1" }

# cudarc — pinned exactly; pulled in transitively by `luminal_cuda_lite` under
# the `cuda` feature. Requires an NVIDIA toolchain to build.
cudarc = { version = "=0.16.6", default-features = false, features = [
    "nvrtc", "driver", "cublas", "cublaslt", "cuda-12080", "dynamic-loading", "std",
    # `nccl` enables the multi-GPU collective bindings (`cudarc::nccl::Comm`)
    # used by `skein_runtime::cuda::nccl::NcclCollective`. Same toolchain
    # requirement as the rest of cudarc.
    "nccl",
    # `f16` enables `NcclType for half::bf16` so the collective can all-reduce
    # bf16 activation buffers ON DEVICE (no host f32 round-trip).
    "f16",
] }
# bf16 element type for device-resident NCCL collectives.
half        = "2"

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1

# Use a local, patched checkout of Luminal (same git rev as the pin above).
# The patch fixes `luminal_cuda_lite`'s bf16 reduction codegen: the max/sum
# reduction kernels accumulated in the element dtype, which (a) emitted an
# ambiguous `bf16 ? : float` ternary that NVRTC rejects on sm_120 and (b) is
# numerically poor. The vendored copy reduces in fp32 and casts at the store.
# See vendor/luminal/crates/luminal_cuda_lite/src/kernel/hlir.rs.
[patch."https://github.com/luminal-ai/luminal"]
luminal          = { path = "vendor/luminal" }
luminal_cuda_lite = { path = "vendor/luminal/crates/luminal_cuda_lite" }
luminal_tracing  = { path = "vendor/luminal/crates/luminal_tracing" }
